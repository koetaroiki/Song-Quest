  <div class="lyt-global_container">
    <header class="lyt-header">
      <div></div>
      <div>
        <button>
          <svg width="28" height="28">
            <use xlink:href="#bell"></use>
          </svg>
        </button>
      </div>
    </header>
    <main class="lyt-main">
      <div class="lyt-contents">
        <!-- プロフィール -->
        <div class="p-profile c-section_md">
          <div class="p-profile_image">
            <img id="avatar" src="assets/images/poty.png">
          </div>
          <p class="p-profile_name" id="name">potey</p>
          <p id="tags">
            #tag, #tag, #tag, #tag, #tag, #tag, #tag, #tag, #tag, #tag
          </p>
          <p id="comment">
            テキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキストテキスト
          </p>
        </div>

        <!-- ボタン -->
        <div class="c-section_md">
          <button class="c-button js_modal_btn" data-modal="sendModal">send</button>
        </div>

        <!-- 最近気に入っている一曲 -->
        <div class="p-recent_favorites c-section_md">
          <h3>Recent Favorites</h3>
          <iframe class="c-main_player" src="https://www.youtube.com/embed/ewOPQZZn4SY?si=jPrmSZ2dQrF-JtTj"
            title="YouTube video player" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <div id="favorite_video"></div>
        </div>

        <div class="tab">
          <div class="tab_item_outer">
            <button class="tab_item js-tabItem is-active" data-target="list1">Favorite List</button>
            <button class="tab_item js-tabItem" data-target="list2">Recommended List</button>
          </div>
          <div id="list1" class="tab_panel js-tabPanel is-active">
            <div class="u-tar"><a id="favorite-link" href="#" target="_blank">YouTube で見る1</a></div>
            <ul id="favorite-items"></ul>
          </div>
          <div id="list2" class="tab_panel js-tabPanel">
            <div class="u-tar"><a id="recommended-link" href="#" target="_blank">YouTube で見る2</a></div>
            <ul id="recommended-items"></ul>
          </div>
          <div id="player"></div>
        </div>
      </div>
    </main>

    <footer class="lyt-footer">
      <div class="p-send_button_outer">
        <button>
          <svg width="48" height="48">
            <use xlink:href="#home"></use>
          </svg>
        </button>
        <div>&nbsp;</div>
        <button class="p-send_button js_modal_btn">
          <svg width="58" height="58">
            <use xlink:href="#onpu"></use>
          </svg>
        </button>
        <button>
          <svg width="48" height="48">
            <use xlink:href="#help"></use>
          </svg>
        </button>
        <button>
          <svg width="48" height="48">
            <use xlink:href="#edit"></use>
          </svg>
        </button>
      </div>
    </footer>
  </div>
